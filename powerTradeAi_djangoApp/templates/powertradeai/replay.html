<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PowerTradeAI — Replay</title>
<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --border: #e2e4e9;
  --text: #1a1d23;
  --text-2: #5f6370;
  --text-3: #9194a0;
  --accent: #2f6f6d;
  --green: #0ca678;
  --red: #e03131;
  --amber: #e67700;
  --panel: #f0f4f4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111318;
    --surface: #1a1d24;
    --border: #2c2f38;
    --text: #e4e5e9;
    --text-2: #a3a7b2;
    --text-3: #6f7480;
    --accent: #4dabaa;
    --green: #20c997;
    --red: #ff6b6b;
    --amber: #fcc419;
    --panel: #151920;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
.shell { max-width: 1480px; margin: 0 auto; padding: 16px 20px; }
header {
  display: flex; justify-content: space-between; align-items: center;
  gap: 16px; margin-bottom: 14px; flex-wrap: wrap;
}
h1 { font-size: 18px; font-weight: 650; }
nav { display: flex; gap: 14px; flex-wrap: wrap; }
nav a { color: var(--accent); text-decoration: none; font-size: 13px; }
.controls {
  display: flex; align-items: end; gap: 10px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; margin-bottom: 12px;
}
.field { display: flex; flex-direction: column; gap: 4px; }
label {
  font-size: 11px; text-transform: uppercase; letter-spacing: .4px;
  color: var(--text-3); font-weight: 600;
}
input, select, button {
  height: 38px; border-radius: 6px; font: inherit; font-size: 14px;
}
input, select {
  border: 1px solid var(--border); background: var(--bg);
  color: var(--text); padding: 0 10px;
}
select#symbol { min-width: 190px; }
button {
  border: 0; background: var(--accent); color: #fff;
  padding: 0 14px; cursor: pointer; font-weight: 600;
}
button.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
button:disabled { opacity: .55; cursor: default; }
.status { color: var(--text-2); font-size: 12px; min-height: 18px; }
.layout {
  display: grid; grid-template-columns: minmax(0, 1fr) 360px;
  gap: 12px; align-items: stretch;
}
.chart-wrap {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; overflow: hidden; min-height: 610px; position: relative;
}
#chart { height: 560px; width: 100%; }
.loading {
  position: absolute; inset: 0 0 50px 0; display: none;
  align-items: center; justify-content: center; background: var(--surface);
  color: var(--text-2); z-index: 5;
}
.transport {
  height: 50px; display: grid; grid-template-columns: auto 1fr auto;
  gap: 10px; align-items: center; padding: 8px 12px;
  border-top: 1px solid var(--border); background: var(--panel);
}
#scrubber { width: 100%; accent-color: var(--accent); }
.clock { color: var(--text-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.legend {
  display: flex; gap: 10px; flex-wrap: wrap; padding: 8px 12px;
  border-top: 1px solid var(--border); background: var(--surface);
  color: var(--text-2); font-size: 11px;
}
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 18px; height: 3px; display: inline-block; border-radius: 2px; }
.side {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; min-height: 610px; display: flex; flex-direction: column;
}
.side-head { padding: 12px 14px; border-bottom: 1px solid var(--border); }
.side-head strong { display: block; font-size: 14px; }
.side-head span { color: var(--text-3); font-size: 12px; }
.events { overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.event {
  border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px;
  background: var(--bg); cursor: pointer;
}
.event.active { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.event.signal { background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
.event.no_signal { color: var(--text-3); }
.event-top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 3px; }
.event-title { font-weight: 650; font-size: 13px; }
.event-time { color: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.event-rule { color: var(--text-2); font-size: 12px; }
.event-detail { color: var(--text-2); font-size: 12px; margin-top: 4px; }
.empty { color: var(--text-3); padding: 20px; text-align: center; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .side, .chart-wrap { min-height: 420px; }
  #chart { height: 420px; }
}
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>Replay visual</h1>
    <nav>
      <a href="{% url 'powertradeai:dashboard' %}">Dashboard</a>
      <a href="{% url 'powertradeai:chart' %}">Chart</a>
      <a href="{% url 'powertradeai:agent' %}">Agente</a>
    </nav>
  </header>

  <div class="controls">
    <div class="field">
      <label>Fecha</label>
      <input type="date" id="date">
    </div>
    <div class="field">
      <label>Símbolo</label>
      <select id="symbol">
        {% for symbol in symbols %}
        <option value="{{ symbol }}" {% if symbol == "SPY" %}selected{% endif %}>
          {% if symbol == "AMZN" %}Amazon · AMZN{% elif symbol == "GOOGL" %}Google · GOOGL{% elif symbol == "TSLA" %}Tesla · TSLA{% elif symbol == "AAPL" %}Apple · AAPL{% elif symbol == "NVDA" %}Nvidia · NVDA{% elif symbol == "MSFT" %}Microsoft · MSFT{% elif symbol == "QQQ" %}Nasdaq QQQ · QQQ{% elif symbol == "SPY" %}S&P 500 SPY · SPY{% else %}{{ symbol }}{% endif %}
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label>Estrategia</label>
      <select id="strategy">
        <option value="">Todas del símbolo</option>
        {% for strategy in strategies %}
        <option value="{{ strategy.strategy_id }}" data-symbol="{{ strategy.symbol }}">{{ strategy.strategy_id }}</option>
        {% endfor %}
      </select>
    </div>
    <button id="load-btn">Cargar día</button>
    <button id="play-btn" class="secondary" disabled>Play</button>
    <div class="status" id="status"></div>
  </div>

  <div class="layout">
    <div class="chart-wrap">
      <div class="loading" id="loading">Cargando datos históricos...</div>
      <div id="chart"></div>
      <div class="transport">
        <button id="step-btn" class="secondary" disabled>Avanzar</button>
        <input type="range" id="scrubber" min="0" max="0" value="0" disabled>
        <div class="clock" id="clock">--:--</div>
      </div>
      <div class="legend" id="line-legend"></div>
    </div>
    <aside class="side">
      <div class="side-head">
        <strong>Análisis de reglas</strong>
        <span id="event-summary">Carga una sesión para ver el recorrido en 15m.</span>
      </div>
      <div class="events" id="events">
        <div class="empty">Sin datos cargados.</div>
      </div>
    </aside>
  </div>
</div>

<script
  src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"
  integrity="sha384-JZigAjwiaZtkUbA44CWkPaT3iBb/mU5pO6QOANp+OqHd4q+1+7MG1kzp2OOP9ZfP"
  crossorigin="anonymous"
  referrerpolicy="no-referrer"></script>
<script>
let chart, candles, markers = [];
let allCandles = [], allEvents = [], allTrendlines = [], trendlineSeries = [];
let cursor = 0, timer = null, replayStartIndex = 0;

function color(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function chartOptions() {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  return {
    layout: { background: { type: 'solid', color: dark ? '#1a1d24' : '#ffffff' }, textColor: dark ? '#d1d4dc' : '#333333' },
    grid: { vertLines: { color: dark ? '#2c2f38' : '#e2e4e9' }, horzLines: { color: dark ? '#2c2f38' : '#e2e4e9' } },
    timeScale: { timeVisible: true, secondsVisible: false },
  };
}
function ensureChart() {
  const el = document.getElementById('chart');
  if (chart) return;
  chart = LightweightCharts.createChart(el, { width: el.clientWidth, height: el.clientHeight, ...chartOptions() });
  candles = chart.addCandlestickSeries({
    upColor: '#0ca678', downColor: '#e03131',
    borderUpColor: '#0ca678', borderDownColor: '#e03131',
    wickUpColor: '#0ca678', wickDownColor: '#e03131',
  });
  new ResizeObserver(() => chart.applyOptions({ width: el.clientWidth, height: el.clientHeight })).observe(el);
}
function trendlineStyle(line) {
  if (line.kind === 'soporte') return { color: '#0ca678', width: 2, style: LightweightCharts.LineStyle.Solid };
  if (line.kind === 'resistencia') return { color: '#e03131', width: 2, style: LightweightCharts.LineStyle.Solid };
  return { color: '#e67700', width: 1, style: LightweightCharts.LineStyle.Dashed };
}
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[ch]);
}
function fmtTime(sec) {
  if (!sec) return '--:--';
  return new Date(sec * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
}
function filterStrategyOptions() {
  const symbol = document.getElementById('symbol').value;
  for (const opt of document.querySelectorAll('#strategy option[data-symbol]')) {
    opt.hidden = opt.dataset.symbol !== symbol;
  }
  const selected = document.querySelector('#strategy option:checked');
  if (selected?.dataset.symbol && selected.dataset.symbol !== symbol) {
    document.getElementById('strategy').value = '';
  }
}
async function loadReplay() {
  const date = document.getElementById('date').value;
  const symbol = document.getElementById('symbol').value;
  const strategy = document.getElementById('strategy').value;
  const status = document.getElementById('status');
  if (!date) { status.textContent = 'Selecciona una fecha.'; return; }
  stop();
  document.getElementById('loading').style.display = 'flex';
  status.textContent = 'Cargando...';
  try {
    const qs = new URLSearchParams({date, symbol});
    if (strategy) qs.set('strategy', strategy);
    const resp = await fetch(`{% url 'powertradeai:replay_data' %}?${qs}`);
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || resp.statusText);
    ensureChart();
    allCandles = data.candles || [];
    allEvents = data.events || [];
    allTrendlines = data.trendlines || [];
    replayStartIndex = findReplayStartIndex(data.replay_start_time);
    cursor = replayStartIndex;
    document.getElementById('scrubber').min = replayStartIndex;
    document.getElementById('scrubber').max = Math.max(replayStartIndex, allCandles.length - 1);
    document.getElementById('scrubber').disabled = allCandles.length === 0;
    document.getElementById('play-btn').disabled = allCandles.length === 0;
    document.getElementById('step-btn').disabled = allCandles.length === 0;
    renderEvents();
    drawTrendlines();
    draw();
    status.textContent = `${data.date} · ${data.symbol} · ${data.timeframe || '15m'} · ${allCandles.length} velas RTH · ${allEvents.length} eventos`;
    const signals = allEvents.filter(e => e.type === 'signal').length;
    document.getElementById('event-summary').textContent = `${data.strategies.length} regla(s), ${signals} señal(es), ${allTrendlines.length} línea(s).`;
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}
function drawTrendlines() {
  if (!chart) return;
  trendlineSeries.forEach(series => chart.removeSeries(series));
  trendlineSeries = [];
  const legend = document.getElementById('line-legend');
  legend.replaceChildren();
  const labels = new Set();
  allTrendlines.forEach(line => {
    if (!line.points || line.points.length < 2) return;
    const style = trendlineStyle(line);
    const series = chart.addLineSeries({
      color: style.color,
      lineWidth: style.width,
      lineStyle: style.style,
      priceLineVisible: false,
      lastValueVisible: false,
      crosshairMarkerVisible: false,
      title: line.label || '',
    });
    series.setData(line.points);
    trendlineSeries.push(series);
    const label = `${line.timeframe} ${line.kind}`;
    if (!labels.has(label)) {
      labels.add(label);
      const item = document.createElement('span');
      const swatch = document.createElement('i');
      swatch.style.background = style.color;
      if (line.kind === 'corte') swatch.style.opacity = '0.8';
      item.append(swatch, document.createTextNode(label));
      legend.appendChild(item);
    }
  });
}
function draw() {
  if (!candles) return;
  const visible = allCandles.slice(0, cursor + 1);
  candles.setData(visible);
  const currentTime = visible.length ? visible[visible.length - 1].time : null;
  markers = allEvents
    .filter(e => e.type === 'signal' && e.time <= currentTime)
    .map(e => ({
      time: e.time,
      position: e.direction === 'PUT' ? 'aboveBar' : 'belowBar',
      color: e.direction === 'PUT' ? '#e03131' : '#0ca678',
      shape: e.direction === 'PUT' ? 'arrowDown' : 'arrowUp',
      text: e.strategy_id,
    }));
  candles.setMarkers(markers);
  document.getElementById('scrubber').value = cursor;
  document.getElementById('clock').textContent = fmtTime(currentTime);
  activateEvents(currentTime);
  if (cursor === allCandles.length - 1) stop();
}
function findReplayStartIndex(startTime) {
  if (!allCandles.length) return 0;
  if (!startTime) return 0;
  const idx = allCandles.findIndex(c => c.time >= startTime);
  return idx < 0 ? 0 : idx;
}
function renderEvents() {
  const box = document.getElementById('events');
  box.replaceChildren();
  if (!allEvents.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Sin eventos para esta selección.';
    box.appendChild(empty);
    return;
  }
  allEvents.forEach((e, index) => {
    const item = document.createElement('div');
    item.className = `event ${e.type}`;
    item.dataset.index = index;
    item.dataset.time = e.time;
    item.innerHTML =
      `<div class="event-top"><div class="event-title">${escapeHtml(e.label)}</div>` +
      `<div class="event-time">${fmtTime(e.time)}</div></div>` +
      `<div class="event-rule">${escapeHtml(e.strategy_id)}${e.price ? ' · ' + escapeHtml(e.price) : ''}</div>` +
      `<div class="event-detail">${escapeHtml(e.detail || '')}</div>`;
    item.addEventListener('click', () => seekToTime(e.time));
    box.appendChild(item);
  });
}
function activateEvents(currentTime) {
  let active = -1;
  allEvents.forEach((e, i) => { if (e.time <= currentTime) active = i; });
  document.querySelectorAll('.event').forEach((el, i) => {
    el.classList.toggle('active', i === active);
    if (i === active) el.scrollIntoView({ block: 'nearest' });
  });
}
function seekToTime(time) {
  const idx = allCandles.findIndex(c => c.time >= time);
  cursor = Math.max(replayStartIndex, idx < 0 ? allCandles.length - 1 : idx);
  draw();
}
function step() {
  cursor = Math.min(cursor + 1, allCandles.length - 1);
  draw();
}
function play() {
  if (timer) { stop(); return; }
  document.getElementById('play-btn').textContent = 'Pausar';
  timer = setInterval(step, 220);
}
function stop() {
  if (timer) clearInterval(timer);
  timer = null;
  document.getElementById('play-btn').textContent = 'Play';
}

document.getElementById('symbol').addEventListener('change', filterStrategyOptions);
document.getElementById('load-btn').addEventListener('click', loadReplay);
document.getElementById('play-btn').addEventListener('click', play);
document.getElementById('step-btn').addEventListener('click', step);
document.getElementById('scrubber').addEventListener('input', e => {
  cursor = Math.max(replayStartIndex, Number(e.target.value));
  draw();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (!chart) return;
  chart.applyOptions(chartOptions());
});

const today = new Date();
today.setDate(today.getDate() - 1);
document.getElementById('date').value = today.toISOString().slice(0, 10);
filterStrategyOptions();
</script>
</body>
</html>
