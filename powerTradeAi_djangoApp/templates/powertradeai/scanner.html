{% load i18n %}
<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scanner de apertura · PowerTradeAI</title>
<style>
:root{--bg:#111318;--panel:#1a1d24;--border:#2c2f38;--text:#e4e5e9;--muted:#9194a0;--accent:#5c7cfa;--green:#20c997;--red:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1500px;margin:auto;padding:26px 22px}header{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:28px;flex-wrap:wrap}h1{margin:0;font-size:28px}h1 span{color:var(--accent)}nav{display:flex;gap:18px;flex-wrap:wrap}a{color:var(--muted);text-decoration:none;font-weight:650}a:hover{color:var(--text)}.panel{border:1px solid var(--border);border-radius:8px;background:var(--panel);overflow:hidden}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px;border-bottom:1px solid var(--border)}.title{font-size:22px;font-weight:750}.sub{color:var(--muted);margin-top:6px}.btn{border:0;border-radius:8px;padding:12px 18px;background:var(--accent);color:#fff;font-weight:800;font-size:15px;cursor:pointer}.btn:disabled{opacity:.6}.status{color:var(--muted);padding:14px 22px}.body{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:13px 14px;border-bottom:1px solid var(--border);text-align:right}th{color:var(--muted);font-size:12px;text-transform:uppercase}th:first-child,td:first-child{text-align:left}.sym{font-weight:700}.sym a{color:var(--accent)}.badge{display:inline-block;padding:4px 8px;border-radius:6px;background:#29314d}.up{color:var(--green)}.down{color:var(--red)}.empty{padding:28px 22px;color:var(--muted)}
</style></head><body><div class="shell"><header><h1><span>Power</span>TradeAI</h1><nav><a href="{% url 'powertradeai:dashboard' %}">Dashboard</a><a href="{% url 'powertradeai:scanner' %}">Scanner</a><a href="{% url 'powertradeai:replay' %}">Replay</a><a href="{% url 'powertradeai:strategies_control' %}">Reglas</a><a href="{% url 'admin:logout' %}">Cerrar sesion</a></nav></header>
<section class="panel"><div class="head"><div><div class="title">Scanner de apertura</div><div class="sub">Bollinger 15m contra apertura y tendencia MA20/MA40 en 1h</div></div><button class="btn" id="scan" type="button">Escanear</button></div><div class="status" id="status">Pulsa «Escanear» para calcular.</div><div class="body" id="body"><div class="empty">Sin resultados todavía.</div></div></section></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('scan').onclick=async()=>{const b=document.getElementById('scan'),st=document.getElementById('status'),box=document.getElementById('body');b.disabled=true;st.textContent='Calculando...';try{const r=await fetch('{% url "powertradeai:scanner_data" %}');if(!r.ok)throw Error(await r.text());const d=await r.json();let rows=d.rows.map(x=>{if(!x.status||x.status==='ERROR'||x.status==='SIN_DATOS')return `<tr><td class="sym">${esc(x.symbol)}</td><td colspan="10">${esc(x.status||'sin datos')}</td></tr>`;const color=x.trend==='alcista'?'up':x.trend==='bajista'?'down':'';return `<tr><td class="sym"><a href="{% url 'powertradeai:chart' %}?symbol=${encodeURIComponent(x.symbol)}">${esc(x.symbol)}</a></td><td>${esc(x.status)}</td><td class="${color}">${esc(x.trend)}</td><td>${x.counter_trend?'Contra-tendencia':'A favor'}</td><td>${x.score==null?'—':x.score.toFixed(2)}</td><td>${x.lower.toFixed(2)}</td><td>${x.middle.toFixed(2)}</td><td>${x.upper.toFixed(2)}</td><td>${x.price==null?'—':x.price.toFixed(2)}</td><td>${x.z==null?'—':x.z.toFixed(2)}</td></tr>`}).join('');box.innerHTML=`<table><thead><tr><th>Simbolo</th><th>Estado</th><th>Tendencia</th><th>Tipo</th><th>Score</th><th>Banda inf</th><th>Media</th><th>Banda sup</th><th>Precio</th><th>Z</th></tr></thead><tbody>${rows}</tbody></table>`;st.textContent=`${d.date} · ${d.rows.filter(x=>x.price_status==='ARRIBA'||x.price_status==='ABAJO').length} fuera de banda`;}catch(e){box.innerHTML=`<div class="empty">Error: ${esc(e.message)}</div>`;st.textContent='';}finally{b.disabled=false}};
</script></body></html>
